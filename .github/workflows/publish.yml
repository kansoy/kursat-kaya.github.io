name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-portfolio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Save the built website and CVs
        uses: actions/upload-artifact@v7
        with:
          name: portfolio
          path: site/
          retention-days: 7
          if-no-files-found: error
